stages:
  - deploy

deploy:
  image:
    name: ubuntu:latest
  stage: deploy
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'main'
  before_script:
    - apt-get -yq update
    - apt-get -yqq install ssh rsync
    - install -m 600 -D /dev/null ~/.ssh/id_rsa
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_rsa
    - ssh-keyscan -H $SSH_HOST > ~/.ssh/known_hosts
  script:
    - rsync -azP ./ $SSH_USER@$SSH_HOST:$WORK_DIR
    - ssh $SSH_USER@$SSH_HOST "cd $WORK_DIR && sbatch slurm/run_pipeline.sh"
  after_script:
    - rm -rf ~/.ssh
